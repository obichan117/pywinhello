# pywinhello workspace root
# Firmware: see firmware/CMakeLists.txt
# PC software: see pc/pyproject.toml
# Installer: see installer/pywinhello.iss

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pc/src", "pc/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["pc/tests"]
addopts = ["--import-mode=importlib", "--ignore=pc/tests/integration"]

[tool.mypy]
python_version = "3.11"
strict = true
