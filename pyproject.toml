[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywinhello"
version = "0.1.0"
description = "Automate Windows Hello PIN entry via USB HID keyboard (Raspberry Pi Pico)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "obichan117" }]
keywords = ["windows-hello", "hid", "pico", "webauthn", "pin", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]",
]

[project.scripts]
pywinhello = "pywinhello.cli:main"

[project.urls]
Repository = "https://github.com/obichan117/pywinhello"
Documentation = "https://obichan117.github.io/pywinhello"

[tool.hatch.build.targets.wheel]
packages = ["src/pywinhello"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.mypy]
python_version = "3.11"
strict = true
