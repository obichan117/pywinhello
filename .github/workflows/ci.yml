name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-pc:
    name: Test PC Software
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: pc
        run: uv sync --extra dev

      - name: Lint
        working-directory: pc
        run: uv run ruff check src/ tests/

      - name: Type check
        working-directory: pc
        run: uv run mypy src/pywinhello/

      - name: Test
        working-directory: pc
        run: uv run pytest tests/ --import-mode=importlib --ignore=tests/integration -v --tb=short

  build-firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pico SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
          git clone --depth 1 -b 2.1.0 https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          cd /tmp/pico-sdk && git submodule update --init
          echo "PICO_SDK_PATH=/tmp/pico-sdk" >> $GITHUB_ENV

      - name: Build firmware (all variants)
        working-directory: firmware
        run: |
          mkdir -p build
          for board in pico pico_w pico2 pico2_w; do
            echo "=== Building for $board ==="
            mkdir -p "build_${board}" && cd "build_${board}"
            cmake .. -DPICO_BOARD="$board"
            make -j$(nproc)
            cp pywinhello_firmware.uf2 ../build/pywinhello_${board}.uf2
            for f in test_usb_minimal test_usb_custom_cdc; do
              if [ -f "${f}.uf2" ]; then
                cp "${f}.uf2" "../build/${f}_${board}.uf2"
              fi
            done
            cd ..
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/build/*.uf2
          retention-days: 30

      # Keep the committed PC-side bundle in lockstep with the firmware source so
      # local `pywinhello setup` and the packaged installer never flash a stale
      # .uf2 (the exact failure that shipped pre-USB-fix firmware to a device).
      - name: Refresh bundled firmware in PC package
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          dest=pc/src/pywinhello/_data/firmware
          mkdir -p "$dest"
          for board in pico pico_w pico2 pico2_w; do
            cp "firmware/build/pywinhello_${board}.uf2" "$dest/pywinhello_${board}.uf2"
          done
          if git diff --quiet -- "$dest"; then
            echo "Bundled firmware already current — nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$dest"
            git commit -m "chore: refresh bundled firmware .uf2 from source [skip ci]"
            git push
          fi

  build-installer:
    name: Build Installer
    needs: [test-pc, build-firmware]
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: pc
        run: uv sync --extra dev

      # Firmware must be bundled into the package BEFORE PyInstaller freezes the
      # exes, so the shipped CLI flashes current firmware regardless of what the
      # committed _data/firmware/ copy happens to be.
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware/build/

      - name: Bundle fresh firmware into PC package
        shell: bash
        run: |
          dest=pc/src/pywinhello/_data/firmware
          mkdir -p "$dest"
          for board in pico pico_w pico2 pico2_w; do
            cp "firmware/build/pywinhello_${board}.uf2" "$dest/pywinhello_${board}.uf2"
          done

      - name: Build monitor executable
        working-directory: pc
        run: |
          uv pip install pyinstaller
          uv run pyinstaller --onefile --noconsole --name pywinhello-monitor src/pywinhello/monitor/service.py

      - name: Build settings executable
        working-directory: pc
        run: |
          uv run pyinstaller --onefile --noconsole --name pywinhello-settings --icon ../installer/assets/pywinhello.ico src/pywinhello/gui/app.py

      - name: Build CLI executable
        working-directory: pc
        run: |
          uv run pyinstaller --onefile --name pywinhello --icon ../installer/assets/pywinhello.ico --add-data "src/pywinhello/_data;pywinhello/_data" src/pywinhello/__main__.py

      - name: Build tray executable
        working-directory: pc
        run: |
          uv run pyinstaller --onefile --noconsole --name pywinhello-tray --icon ../installer/assets/pywinhello.ico src/pywinhello/tray/app.py

      - name: Copy dist files
        run: |
          mkdir -p dist
          cp pc/dist/pywinhello-monitor.exe dist/
          cp pc/dist/pywinhello.exe dist/
          cp pc/dist/pywinhello-settings.exe dist/
          cp pc/dist/pywinhello-tray.exe dist/

      - name: Build installer
        run: |
          choco install innosetup -y
          iscc installer/pywinhello.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Output/pywinhello_setup.exe
          retention-days: 30
