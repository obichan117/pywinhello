# pywinhello configuration
# Copy to config.yaml and edit for your setup.

# HID bridge settings
hid_port: auto              # COM port (auto = VID:PID detection)
inter_key_delay_ms: 50      # Delay between PIN digits

# Per-application PIN mapping
# The monitor identifies which process triggered Windows Hello
# and looks up the PIN here.
apps:
  - exe: MarketSpeed2.exe
    pin: "1234"
    # pin_select_keys: [ESCAPE]  # Fallback for fingerprint mode

  # - exe: chrome.exe
  #   pin: "5678"
