[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pywinhello"
version = "2.0.0-dev"
description = "Raspberry Pi Pico as a physical key for Windows Hello automation"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "obichan117" }]
keywords = ["windows-hello", "hid", "pico", "webauthn", "pin", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]

dependencies = [
    "pyserial>=3.5",
    "customtkinter>=5.2",
    "requests>=2.31",
    "wmi>=1.5; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pywinhello = "pywinhello.cli:main"

[project.gui-scripts]
pywinhello-settings = "pywinhello.gui.app:main"

[project.urls]
Repository = "https://github.com/obichan117/pywinhello"

[tool.hatch.build.targets.wheel]
packages = ["src/pywinhello"]
